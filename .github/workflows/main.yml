BASE_PATH="***"
RELEASE_NAME="20260601133710-867cf06"
RELEASE_PATH="$BASE_PATH/releases/$RELEASE_NAME"

PHP_BIN="php8.2"

if ! command -v php8.2 >/dev/null 2>&1; then
  PHP_BIN="php"
fi

echo "Base path: $BASE_PATH"
echo "Release path: $RELEASE_PATH"
echo "Using PHP: $PHP_BIN"

mkdir -p "$BASE_PATH/releases"
mkdir -p "$BASE_PATH/shared/storage/app"
mkdir -p "$BASE_PATH/shared/storage/framework/cache"
mkdir -p "$BASE_PATH/shared/storage/framework/sessions"
mkdir -p "$BASE_PATH/shared/storage/framework/views"
mkdir -p "$BASE_PATH/shared/storage/logs"
mkdir -p "$RELEASE_PATH"

if [ ! -f "/tmp/release.tar.gz" ]; then
  echo "ERROR: release archive not found at /tmp/release.tar.gz"
  exit 1
fi

tar -xzf /tmp/release.tar.gz -C "$RELEASE_PATH"

if [ ! -f "$BASE_PATH/shared/.env" ]; then
  echo "ERROR: shared .env missing at $BASE_PATH/shared/.env"
  exit 1
fi

rm -f "$RELEASE_PATH/.env"
ln -sfn "$BASE_PATH/shared/.env" "$RELEASE_PATH/.env"

rm -rf "$RELEASE_PATH/storage"
ln -sfn "$BASE_PATH/shared/storage" "$RELEASE_PATH/storage"

cd "$RELEASE_PATH"

echo "Checking Laravel files"
test -f artisan
test -f composer.json
test -d vendor

echo "Fixing permissions before artisan commands"
chown -R ftpuser:www-data "$RELEASE_PATH"
chown -R ftpuser:www-data "$BASE_PATH/shared"
chmod -R 775 "$BASE_PATH/shared/storage"

if [ -d "$RELEASE_PATH/bootstrap/cache" ]; then
  chmod -R 775 "$RELEASE_PATH/bootstrap/cache"
fi

echo "Clearing Laravel cache"
$PHP_BIN artisan optimize:clear || true

echo "Running package discovery on server after .env link"
$PHP_BIN artisan package:discover --ansi

echo "Migration is commented for now"
# $PHP_BIN artisan migrate --force

echo "Caching Laravel config, routes and views"
$PHP_BIN artisan config:cache
$PHP_BIN artisan route:cache
$PHP_BIN artisan view:cache

echo "Creating storage link"
$PHP_BIN artisan storage:link || true

echo "Switching current symlink"
ln -sfn "$RELEASE_PATH" "$BASE_PATH/current_tmp"
mv -Tf "$BASE_PATH/current_tmp" "$BASE_PATH/current"

cd "$BASE_PATH/current"

echo "Restarting queue workers"
$PHP_BIN artisan queue:restart || true

echo "Keeping last 5 releases only"
ls -dt "$BASE_PATH"/releases/* | tail -n +6 | xargs -r rm -rf

rm -f /tmp/release.tar.gz

echo "Dev deployment completed successfully"

