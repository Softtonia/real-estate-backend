name: Deploy Dev

on:
  push:
    branches:
      - dev

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    name: Deploy Laravel Backend To Dev
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set Release Name
        run: |
          RELEASE_NAME="$(date +%Y%m%d%H%M%S)-${GITHUB_SHA::7}"
          echo "RELEASE_NAME=$RELEASE_NAME" >> "$GITHUB_ENV"

      - name: Setup SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEV_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.DEV_PORT }}" "${{ secrets.DEV_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare Server
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEV_PORT }}" "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" "
            set -e
            BASE_PATH='${{ secrets.DEV_BASE_PATH }}'
            RELEASE_NAME='${{ env.RELEASE_NAME }}'
            RELEASE_PATH=\"\$BASE_PATH/releases/\$RELEASE_NAME\"

            command -v rsync >/dev/null 2>&1 || { echo 'ERROR: rsync missing on server'; exit 1; }
            command -v composer >/dev/null 2>&1 || { echo 'ERROR: composer missing on server'; exit 1; }

            if command -v php8.2 >/dev/null 2>&1; then
              PHP_BIN='php8.2'
            elif command -v php >/dev/null 2>&1; then
              PHP_BIN='php'
            else
              echo 'ERROR: PHP missing on server'
              exit 1
            fi

            mkdir -p \"\$BASE_PATH/releases\"
            mkdir -p \"\$BASE_PATH/shared/storage/app/public\"
            mkdir -p \"\$BASE_PATH/shared/storage/framework/cache\"
            mkdir -p \"\$BASE_PATH/shared/storage/framework/sessions\"
            mkdir -p \"\$BASE_PATH/shared/storage/framework/views\"
            mkdir -p \"\$BASE_PATH/shared/storage/logs\"
            mkdir -p \"\$BASE_PATH/shared/backups\"
            mkdir -p \"\$RELEASE_PATH\"
          "

      - name: Upload Files With Rsync
        run: |
          set -e
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.DEV_PORT }}" \
            --exclude=".git" \
            --exclude=".github" \
            --exclude=".env" \
            --exclude="node_modules" \
            --exclude="vendor" \
            --exclude="release.tar.gz" \
            --exclude="bootstrap/cache/*.php" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/cache/*" \
            --exclude="storage/framework/sessions/*" \
            --exclude="storage/framework/views/*" \
            --exclude="storage/framework/testing/*" \
            --exclude="tests" \
            ./ "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}:${{ secrets.DEV_BASE_PATH }}/releases/${{ env.RELEASE_NAME }}/"

      - name: Activate Release
        run: |
          set -e
          ssh -i ~/.ssh/deploy_key -p "${{ secrets.DEV_PORT }}" "${{ secrets.DEV_USER }}@${{ secrets.DEV_HOST }}" << 'EOF'
          set -e

          BASE_PATH="${{ secrets.DEV_BASE_PATH }}"
          RELEASE_NAME="${{ env.RELEASE_NAME }}"
          RELEASE_PATH="$BASE_PATH/releases/$RELEASE_NAME"

          if command -v php8.2 >/dev/null 2>&1; then
            PHP_BIN="php8.2"
          else
            PHP_BIN="php"
          fi

          echo "Release path: $RELEASE_PATH"

          if [ ! -f "$BASE_PATH/shared/.env" ]; then
            if [ -f "$BASE_PATH/.env" ]; then
              cp "$BASE_PATH/.env" "$BASE_PATH/shared/.env"
            else
              echo "ERROR: shared .env missing at $BASE_PATH/shared/.env"
              exit 1
            fi
          fi

          if [ -d "$BASE_PATH/storage" ] && [ ! -f "$BASE_PATH/shared/.storage_copied" ]; then
            cp -a "$BASE_PATH/storage/." "$BASE_PATH/shared/storage/" || true
            touch "$BASE_PATH/shared/.storage_copied"
          fi

          rm -f "$RELEASE_PATH/.env"
          ln -sfn "$BASE_PATH/shared/.env" "$RELEASE_PATH/.env"

          rm -rf "$RELEASE_PATH/storage"
          ln -sfn "$BASE_PATH/shared/storage" "$RELEASE_PATH/storage"

          mkdir -p "$RELEASE_PATH/public"
          rm -rf "$RELEASE_PATH/public/storage"
          ln -sfn "$BASE_PATH/shared/storage/app/public" "$RELEASE_PATH/public/storage"

          cd "$RELEASE_PATH"

          test -f artisan
          test -f composer.json
          test -d public

          rm -f bootstrap/cache/*.php

          composer install \
            --no-dev \
            --no-interaction \
            --prefer-dist \
            --optimize-autoloader \
            --no-scripts

          chmod -R 775 "$BASE_PATH/shared/storage" || true
          chmod -R 775 "$RELEASE_PATH/bootstrap/cache" || true

          $PHP_BIN artisan package:discover --ansi
          $PHP_BIN artisan optimize:clear || true

          export RELEASE_PATH

          DB_NAME=$($PHP_BIN -r 'require getenv("RELEASE_PATH")."/vendor/autoload.php"; $app = require getenv("RELEASE_PATH")."/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.mysql.database");')
          DB_USER=$($PHP_BIN -r 'require getenv("RELEASE_PATH")."/vendor/autoload.php"; $app = require getenv("RELEASE_PATH")."/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.mysql.username");')
          DB_PASS=$($PHP_BIN -r 'require getenv("RELEASE_PATH")."/vendor/autoload.php"; $app = require getenv("RELEASE_PATH")."/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.mysql.password");')
          DB_HOST=$($PHP_BIN -r 'require getenv("RELEASE_PATH")."/vendor/autoload.php"; $app = require getenv("RELEASE_PATH")."/bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo config("database.connections.mysql.host");')

          if command -v mysqldump >/dev/null 2>&1; then
            mysqldump \
              --single-transaction \
              --quick \
              --lock-tables=false \
              --no-tablespaces \
              -h "$DB_HOST" \
              -u "$DB_USER" \
              -p"$DB_PASS" \
              "$DB_NAME" > "$BASE_PATH/shared/backups/db-backup-before-migrate-$RELEASE_NAME.sql"
          else
            echo "WARNING: mysqldump not found, skipping database backup"
          fi

          $PHP_BIN artisan migrate --force

          $PHP_BIN artisan config:cache
          $PHP_BIN artisan route:cache
          $PHP_BIN artisan view:cache

          echo "$RELEASE_NAME" > "$RELEASE_PATH/public/deploy-version.txt"

          ln -sfn "$RELEASE_PATH" "$BASE_PATH/current_tmp"
          mv -Tf "$BASE_PATH/current_tmp" "$BASE_PATH/current"

          cd "$BASE_PATH/current"
          $PHP_BIN artisan queue:restart || true

          ls -dt "$BASE_PATH"/releases/* 2>/dev/null | tail -n +6 | xargs -r rm -rf

          echo "Dev deployment completed successfully"
          EOF